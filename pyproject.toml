# Packages the deployed server needs (Vercel reads this). Local setup still uses requirements.txt.
[project]
name = "logismart"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "starlette==1.7.0",
    "uvicorn==0.54.0",
    "pandas==3.0.6",
    "numpy==2.5.3",
    "scikit-learn==1.9.1",
    "joblib==1.5.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
